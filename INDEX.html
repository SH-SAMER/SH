    function searchResult() {
        const query = document.getElementById('searchInput').value.trim();
        const resultBox = document.getElementById('resultBox');
        
        if (query === "") {
            resultBox.style.display = "block";
            resultBox.className = "result-box error";
            resultBox.innerHTML = "الرجاء إدخال رقم القيد أو الاسم للبحث.";
            return;
        }

        // البحث في قاعدة البيانات بمطابقة رقم القيد أو الاسم
        const student = studentsDatabase.find(s => s.id === query || s.name === query);

        if (!student) {
            resultBox.style.display = "block";
            resultBox.className = "result-box error";
            resultBox.innerHTML = "عذراً، لم يتم العثور على طالب بهذا الاسم الكامل أو رقم القيد. يرجى التأكد من كتابة الاسم كما هو في الكشوفات.";
            return;
        }

        // التحقق من وجود قسط مالي (حجب النتيجة)
        if (student.hasDebt) {
            resultBox.style.display = "block";
            resultBox.className = "result-box error";
            resultBox.innerHTML = `عذراً يا <strong>${student.name}</strong>، تعذر إظهار النتيجة لوجود أقساط مالية مستحقة أو مشكلة إدارية. يرجى مراجعة الإدارة.`;
            return;
        }

        // إظهار النتيجة في حال لم يكن عليه أقساط
        resultBox.style.display = "block";
        resultBox.className = "result-box success";
        resultBox.innerHTML = `
            <strong>نتيجة الطالب:</strong><br>
            - الاسم: ${student.name}<br>
            - رقم القيد: ${student.id}<br>
            - التقدير: ${student.grade}<br>
            - النسبة المئوية: ${student.percentage}
        `;
    }
